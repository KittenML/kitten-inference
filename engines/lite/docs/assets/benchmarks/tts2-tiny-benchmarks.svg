<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">Kitten TTS 2 mini, nano and pico: kitten-inference against the official runtimes</title>
<desc id="desc">Real-time factor (compute time / audio length, lower is faster). CPU: kitten-inference float32 against the official int8 ONNX files with ONNX Runtime (kittenml 0.9.8), 4 threads, 69 s of English speech; Ryzen 9 9900X pico is the middle of two runs (0.010 and 0.014). GPU: kitten-inference CUDA float32 against the official PyTorch model (default settings) on the same GPU, long English text.</desc>
<style>.bg{fill:#ffffff}.t{font:700 26px Arial,Helvetica,sans-serif;fill:#111}.s{font:400 14px Arial,Helvetica,sans-serif;fill:#555}.h{font:700 18px Arial,Helvetica,sans-serif;fill:#111}.g{font:700 15px Arial,Helvetica,sans-serif;fill:#2a7f62}.l{font:400 13px Arial,Helvetica,sans-serif;fill:#333}.v{font:600 12px Arial,Helvetica,sans-serif;fill:#111}.ours{fill:#2a7f62}.onnx{fill:#b8bec4}.pt{fill:#d9a066}.rule{stroke:#dddddd;stroke-width:1}</style>
